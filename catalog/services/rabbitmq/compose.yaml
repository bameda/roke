# RabbitMQ · rabbitmq:5672 · AMQP_URL · UI http://127.0.0.1:15672
services:
  # The project's network is internal: the gateway publishes the UI.
  gateway:
    environment:
      ROKE_FORWARD_RABBITMQ: "45672 rabbitmq:15672"
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:45672"

  box:
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER:-dev}:${RABBITMQ_PASSWORD:-dev}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-4}-management-alpine
    # RabbitMQ keeps its data under a directory named after the node, which
    # includes the hostname: pin it so data survives container recreation.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
    security_opt:
      - no-new-privileges:true

volumes:
  rabbitmq-data:
