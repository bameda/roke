# Checks run before each commit, on the changed files. Set it up once with
#   uvx pre-commit install
# and run every check on every file with
#   uvx pre-commit run --all-files
# GitHub Actions runs the same checks (.github/workflows/test.yml).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-executables-have-shebangs

  # Python: lint (fixing what it can) and format.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Python: types.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: ^roke/

  # Shell scripts.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # GitHub and Renovate files, against their official schemas.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-renovate
      - id: check-jsonschema
        name: check GitHub issue forms
        files: ^\.github/ISSUE_TEMPLATE/(?!config\.yml$).*\.ya?ml$
        args: [--builtin-schema, vendor.github-issue-forms]
      - id: check-jsonschema
        name: check GitHub issue config
        files: ^\.github/ISSUE_TEMPLATE/config\.yml$
        args: [--builtin-schema, vendor.github-issue-config]

  # GitHub Actions workflows: security issues.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
