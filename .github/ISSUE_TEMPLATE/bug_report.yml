name: Bug report
description: Something does not work as the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it! Check [Troubleshooting](https://github.com/bameda/roke/blob/main/docs/troubleshooting.md) first: it may already be there.
        **Security problems** (escaping the box, getting around the network restrictions...) must be reported privately: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The commands you ran, as exactly as possible.
      placeholder: |
        roke service add postgres
        roke
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The output of the failing command, including roke's messages. For network problems, add `roke network blocked`.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: |
        Run `roke doctor --yaml` from the affected project's directory on your host and paste its output, even if it reports failed checks.
        If your version does not support `--yaml`, paste the output of `roke doctor` instead.
      render: yaml
  - type: textarea
    id: settings
    attributes:
      label: roke settings
      description: The output of `roke settings` in the project. Remove anything private.
      render: text
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex CLI
        - OpenCode
        - Other, or not related to an agent
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your distribution and any environment details not covered by the diagnostic report.
      value: |
        distribution: (cat /etc/os-release)
    validations:
      required: true
