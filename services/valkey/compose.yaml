# Valkey (open-source Redis fork) · valkey:6379 · VALKEY_URL
services:
  box:
    environment:
      VALKEY_URL: redis://valkey:6379/0
    depends_on:
      valkey:
        condition: service_healthy

  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-9}-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
