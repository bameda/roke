# Grafana (dashboards) · grafana:3000 · Prometheus and Jaeger preconfigured · UI http://127.0.0.1:3001
services:
  # The project's network is internal: the gateway publishes the UI. Port
  # 3001 on the host, since dev servers often use 3000.
  gateway:
    environment:
      ROKE_FORWARD_GRAFANA: "43000 grafana:3000"
    ports:
      - "127.0.0.1:${GRAFANA_UI_PORT:-3001}:43000"

  box:
    environment:
      GRAFANA_URL: http://grafana:3000
    depends_on:
      grafana:
        condition: service_started

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.3.1}
    environment:
      # Local use only: no login, everyone is an administrator.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # It has no route out anyway: do not try to reach grafana.com.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./catalog/services/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    security_opt:
      - no-new-privileges:true

volumes:
  grafana-data:
