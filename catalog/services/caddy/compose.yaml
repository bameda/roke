# Caddy (reverse proxy) · http://127.0.0.1:8080 -> box:3000 · edit catalog/services/caddy/Caddyfile
services:
  # The project's network is internal: the gateway publishes the UI.
  gateway:
    environment:
      ROKE_FORWARD_CADDY: "48080 caddy:80"
    ports:
      - "127.0.0.1:${CADDY_PORT:-8080}:48080"

  box:
    environment:
      PROXY_URL: http://127.0.0.1:${CADDY_PORT:-8080}
    depends_on:
      caddy:
        condition: service_started

  caddy:
    image: caddy:${CADDY_VERSION:-2}-alpine
    environment:
      PROXY_UPSTREAM: ${PROXY_UPSTREAM:-box:3000}
    volumes:
      - ./catalog/services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
