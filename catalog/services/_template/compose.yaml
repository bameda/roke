# Short description (this first line is what "roke service" shows)
#
# Template for adding any image to the catalog:
#   1. Copy this directory to catalog/services/<name>/ (without the leading "_").
#   2. The service must have the same name as the directory: that is its
#      hostname.
#   3. Add it to the depends_on of "box" so roke starts it.
#   4. Put the connection variables in the environment of "box".
#   5. Volumes without "name:" are per project.
#   6. The project's network is internal: to publish a port (a web UI), ask
#      the gateway to forward it (see the commented block below), with the
#      host port in a variable so it can be changed.
#   7. Explain how to use it in the README.md next to this file, and add it
#      to the catalog table in catalog/services/README.md.

services:
  # To publish the service's web UI on the host, through the gateway:
  # gateway:
  #   environment:
  #     ROKE_FORWARD_MYSERVICE: "45999 myservice:8080"
  #   ports:
  #     - "127.0.0.1:${MYSERVICE_PORT:-8080}:45999"

  box:
    environment:
      MYSERVICE_URL: http://myservice:8080
    depends_on:
      myservice:
        condition: service_started   # or service_healthy if it has a healthcheck

  myservice:
    image: vendor/image:${MYSERVICE_VERSION:-latest}
    environment:
      SOMETHING: value
    volumes:
      - myservice-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  myservice-data:
