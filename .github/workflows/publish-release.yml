name: Publish release

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: roke-release
  cancel-in-progress: false

jobs:
  publish:
    # Called only after both CI jobs pass for this exact main push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a release commit
        id: candidate
        run: python3 scripts/release.py candidate --output "$GITHUB_OUTPUT"
      - name: Verify and publish the tested commit
        if: steps.candidate.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          python3 scripts/release.py publish --repository "$GITHUB_REPOSITORY"
