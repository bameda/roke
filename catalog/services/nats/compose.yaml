# NATS (messaging, with JetStream) · nats:4222 · NATS_URL
services:
  box:
    environment:
      NATS_URL: nats://nats:4222
      NATS_MONITOR_URL: http://nats:8222
    depends_on:
      nats:
        condition: service_healthy

  nats:
    image: nats:${NATS_VERSION:-2.15}-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

volumes:
  nats-data:
