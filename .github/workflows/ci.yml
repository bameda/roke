name: CI and releases

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Checks (pre-commit)
        run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: Check release notes when preparing a release
        run: python3 scripts/release.py candidate --verify --output "$RUNNER_TEMP/release-candidate"
      - name: Tests
        env:
          ROKE_REQUIRE_COMPOSE: "1"
          ROKE_REQUIRE_NO_SKIPS: "1"
        run: uvx pytest --ignore=tests/integration -rs

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Prepare fixture images
        run: |
          docker compose -f tests/integration/compose.yaml build gateway
          docker compose -f tests/integration/compose.yaml pull allowed
      - name: Real Docker tests
        env:
          ROKE_DOCKER_TESTS: "1"
          ROKE_REQUIRE_NO_SKIPS: "1"
        run: uvx pytest tests/integration -v -rs

  publish-release:
    needs: [test, docker-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: $/.github/workflows/publish-release.yml
