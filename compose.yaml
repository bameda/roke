# Base: just the box where the coding agent runs. Services (databases, caches, mail,
# proxy...) are added from catalog/services/<name>/compose.yaml with "roke -s".
# Don't run this directly: use bin/roke.

services:
  # The only container with a route out of the project's internal network:
  # it enforces the network policy (see docs/network.md) and publishes the
  # project's ports on the host.
  gateway:
    image: roke-gateway:latest
    build: ./docker/gateway
    environment:
      ROKE_NETWORK: ${ROKE_NETWORK:-restricted}
      ROKE_NETWORK_ALLOW_ALL: ${ROKE_NETWORK_ALLOW_ALL:-}
    cap_add:
      - NET_ADMIN
    # The host, for the ports allowed as host:PORT (roke network add host:4401).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases: [box]   # the box listens in the gateway's network namespace
      egress: {}
    security_opt:
      - no-new-privileges:true

  box:
    image: roke:latest
    build:
      context: .
      # Passed only when set (in roke.env, for example); otherwise the
      # Dockerfile's defaults apply, so each version lives in one place.
      args:
        - HOST_UID
        - HOST_GID
        - ROKE_AGENTS
        - ROKE_AGENT_VERSIONS
        - POSTGRES_CLIENT_VERSION
        - INSTALL_SERENA
        - SERENA_VERSION
    init: true
    stdin_open: true
    tty: true
    working_dir: ${PROJECT_DIR:?Start the container with bin/roke}
    # Your settings and secrets, global and the project's, from your roke
    # configuration directory (the last one wins).
    env_file:
      - path: ${ROKE_CONFIG_DIR:?Start the container with bin/roke}/roke.env
        required: false
      - path: ${ROKE_CONFIG_DIR}/secrets.env
        required: false
      - path: ${ROKE_PROJECT_CONFIG}/project.env
        required: false
      - path: ${ROKE_PROJECT_CONFIG}/secrets.env
        required: false
    environment:
      # The coding agent to run; chosen by bin/roke.
      ROKE_AGENT: ${ROKE_AGENT:?Start the container with bin/roke}
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-truecolor}
      MISE_TRUSTED_CONFIG_PATHS: ${PROJECT_DIR}
      # Active services, so the agent knows what is available.
      ROKE_SERVICES: ${ROKE_SERVICES:-}
      # Serena (semantic MCP); controlled by bin/roke.
      ROKE_SERENA: ${ROKE_SERENA:-0}
      ROKE_SERENA_DASHBOARD: ${ROKE_SERENA_DASHBOARD:-0}
      ROKE_SERENA_CODEMODE: ${ROKE_SERENA_CODEMODE:-0}
      ROKE_SERENA_USAGE_REPORTING: ${ROKE_SERENA_USAGE_REPORTING:-0}
    volumes:
      # The only writable host path: the project (at the same path).
      - ${PROJECT_DIR}:${PROJECT_DIR}
      # The box's own $HOME, one per project and shared with nothing else:
      # agent logins and sessions, tools installed with mise, caches...
      - home:/home/dev
      # Your configuration for the selected agent (read-only); its setup.sh
      # links it where the agent reads it.
      - ${ROKE_CONFIG_DIR}/agents/${ROKE_AGENT}:/run/roke/agent-config:ro
      # The agents' install and setup scripts and the box's instructions,
      # mounted so that updates arrive with git pull, without a rebuild.
      - ./catalog/agents:/opt/roke/agents:ro
    # No network of its own: it shares the gateway's, so all its traffic goes
    # through the gateway's firewall, which it has no capabilities to change.
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 4096

networks:
  # Every container of the project joins this network unless it says
  # otherwise, and it has no route out: only the gateway does.
  default:
    internal: true
  # The gateway's way out, to the host (published ports) and the internet.
  egress: {}

volumes:
  # Per project (the compose project's name is its prefix). "roke purge"
  # deletes it along with the project's other data.
  home:
