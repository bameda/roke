name: Bug report
description: Something does not work as the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it! Check [Troubleshooting](https://github.com/bameda/roke/blob/main/docs/troubleshooting.md) first: it may already be there.
        **Security problems** (escaping the box, getting around the network restrictions...) must be reported privately: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The commands you ran, as exactly as possible.
      placeholder: |
        roke service add postgres
        roke
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The output of the failing command, including roke's messages. For network problems, add `roke network blocked`.
      render: text
  - type: textarea
    id: settings
    attributes:
      label: roke settings
      description: The output of `roke settings` in the project. Remove anything private.
      render: text
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex CLI
        - OpenCode
        - Other, or not related to an agent
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Run these commands and paste their output.
      value: |
        roke commit:    (git -C ~/.local/share/roke log -1 --oneline, or in your clone)
        distribution:   (cat /etc/os-release | grep PRETTY_NAME)
        docker:         (docker version --format '{{.Server.Version}}')
        docker compose: (docker compose version --short)
        python:         (python3 --version)
    validations:
      required: true
