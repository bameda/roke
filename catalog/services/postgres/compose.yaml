# PostgreSQL · postgres:5432 · DATABASE_URL, PGHOST/PGUSER/PGPASSWORD/PGDATABASE
#
# Requires PostgreSQL 18 or newer: since 18, the official image keeps its data
# in a per-major subdirectory (/var/lib/postgresql/<major>/docker), so the
# volume is mounted at /var/lib/postgresql.
#
# Major upgrades (e.g. 18 -> 19) start with an EMPTY database, because the new
# major uses its own subdirectory. Re-run your migrations/seeds, or move the
# data over (see "PostgreSQL major upgrades" in the README).
services:
  box:
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-dev}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dev}
      PGDATABASE: ${POSTGRES_DB:-app}
      DATABASE_URL: postgres://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
