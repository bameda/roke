# SeaweedFS (S3-compatible storage) · seaweedfs:8333 · S3_ENDPOINT, AWS_* · file browser http://127.0.0.1:8888
services:
  # The project's network is internal: the gateway publishes the file browser.
  gateway:
    environment:
      ROKE_FORWARD_SEAWEEDFS: "48888 seaweedfs:8888"
    ports:
      - "127.0.0.1:${SEAWEEDFS_UI_PORT:-8888}:48888"

  box:
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      AWS_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-dev}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-devdevdev}
      AWS_REGION: us-east-1
    depends_on:
      seaweedfs:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.52}
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-dev}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-devdevdev}
    # Master, volume, filer and S3 in one process. The S3 identities file is
    # JSON, which cannot read variables, so it is written on every start.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities": [{"name": "dev",
          "credentials": [{"accessKey": "$$SEAWEEDFS_ACCESS_KEY", "secretKey": "$$SEAWEEDFS_SECRET_KEY"}],
          "actions": ["Admin", "Read", "List", "Tagging", "Write"]}]}
        JSON
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
          -master.volumeSizeLimitMB=1024
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    security_opt:
      - no-new-privileges:true

volumes:
  seaweedfs-data:
