# Disposable SSH host for testing Ansible · ssh-target:22 · user "ansible" with sudo · ANSIBLE_* preset
#
# A throwaway Debian machine the agent can run playbooks against, so they can
# be tested without touching real infrastructure. Access is key-based only,
# with a test key pair generated per project and shared through a volume
# (mounted read-only in the box at /run/ssh-target).
#
# Its filesystem is not persisted: "roke down" resets it to a clean state.
# No systemd inside, so tasks that manage services with systemd won't work.
# See "Testing Ansible playbooks" in the README.
services:
  box:
    environment:
      SSH_TARGET_HOST: ssh-target
      SSH_TARGET_USER: ansible
      SSH_TARGET_KEY: /run/ssh-target/id_ed25519
      # Defaults for ansible inside the box (inventory values take precedence).
      ANSIBLE_PRIVATE_KEY_FILE: /run/ssh-target/id_ed25519
      ANSIBLE_REMOTE_USER: ansible
      ANSIBLE_HOST_KEY_CHECKING: "False"
    volumes:
      - ssh-target-keys:/run/ssh-target:ro
    depends_on:
      ssh-target:
        condition: service_healthy

  ssh-target:
    build:
      context: ./catalog/services/ssh-target
      args:
        BASE_IMAGE: ${SSH_TARGET_BASE_IMAGE:-debian:trixie-slim}
    environment:
      KEY_OWNER_UID: ${HOST_UID:-1000}
    volumes:
      - ssh-target-keys:/keys
    # No "no-new-privileges" here: playbooks need sudo (become) to work.

volumes:
  ssh-target-keys:
