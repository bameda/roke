# Mailpit (test SMTP server) · mailpit:1025 · SMTP_HOST/SMTP_PORT · UI http://127.0.0.1:8025
services:
  # The project's network is internal: the gateway publishes the UI.
  gateway:
    environment:
      ROKE_FORWARD_MAILPIT: "48025 mailpit:8025"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:48025"

  box:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAILPIT_API: http://mailpit:8025/api
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.33.0}
    security_opt:
      - no-new-privileges:true
